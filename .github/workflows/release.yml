name: Release

# Builds the deliverables on every PR (as workflow artifacts, to try them)
# and publishes them as a GitHub release:
#   - on every push to main, as the next patch version after the latest
#     v<major>.<minor>.<patch> tag (v0.1.0 when there is none); the release
#     creates the tag;
#   - when a tag v<major>.<minor>.<patch> is pushed by hand, as that version
#     (to start a new minor or major series).
# Files:
#   - knockblock-<version>.esphomebundle.tar.gz  firmware config bundle
#   - KnockBlock-<version>.msi                   Windows installer
#   - knockctl-<version>.exe                     command-line tool
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, so consecutive merges get consecutive versions.
# PR runs are grouped per PR and only the latest one matters.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags

      - id: v
        # MSI versions must be numeric: major.minor.patch.
        #   tag push   -> the tag without "v"
        #   main push  -> latest release tag + 1 patch (0.1.0 if none);
        #                 nothing to publish if this commit is already tagged
        #   otherwise  -> 0.0.<run number>, not published
        run: |
          latest="$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              version="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
              version="${version#v}"
              echo "This commit is already released as v$version."
            elif [[ -z "$latest" ]]; then
              version=0.1.0
              publish=true
            else
              IFS=. read -r major minor patch <<<"${latest#v}"
              version="$major.$minor.$((patch + 1))"
              publish=true
            fi
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "Version $version (latest tag: ${latest:-none}, publish: $publish)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  firmware-bundle:
    name: Firmware bundle
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ESPHome (version from proto/VERSION)
        run: pip install "esphome==$(cat proto/VERSION)"

      - name: Build bundle
        run: scripts/build-firmware-bundle.sh "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bundle
          path: dist/knockblock-*.esphomebundle.tar.gz
          if-no-files-found: error

  windows-installer:
    name: Windows installer (MSI)
    needs: version
    # WiX v5 builds MSIs on Windows only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum

      - name: Install WiX v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: Build MSI
        shell: pwsh
        env:
          # The Discord application of the Integrations tab (docs/discord.md);
          # empty when the secrets are not set (the integration then says
          # it is not available).
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: scripts/build-msi.ps1 -Version "${{ needs.version.outputs.version }}"

      - name: Build an older MSI for the upgrade test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force upgrade | Out-Null
          Copy-Item "dist/KnockBlock-${{ needs.version.outputs.version }}.msi" upgrade/keep.msi
          scripts/build-msi.ps1 -Version 0.0.1
          Move-Item dist/KnockBlock-0.0.1.msi upgrade/KnockBlock-0.0.1.msi
          Move-Item upgrade/keep.msi "dist/KnockBlock-${{ needs.version.outputs.version }}.msi" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-test
          path: upgrade/KnockBlock-0.0.1.msi
          if-no-files-found: error

      - name: Build knockctl
        # The command-line tool for trying the light (README); a console
        # program, so no -H=windowsgui.
        working-directory: client
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" \
            -o "../dist/knockctl-${{ needs.version.outputs.version }}.exe" ./cmd/knockctl

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/KnockBlock-*.msi
            dist/knockctl-*.exe
          if-no-files-found: error

  installer-smoke-test:
    name: Install and uninstall the MSI on Windows
    needs: windows-installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - uses: actions/download-artifact@v4
        with:
          name: upgrade-test

      - name: Install, check, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem KnockBlock-*.msi | Where-Object Name -ne 'KnockBlock-0.0.1.msi').FullName
          $old = (Resolve-Path KnockBlock-0.0.1.msi).Path
          $version = [regex]::Match($msi, 'KnockBlock-(.+)\.msi').Groups[1].Value
          $machineExe = Join-Path $env:ProgramFiles 'KnockBlock\knockblock.exe'
          $userExe = Join-Path $env:LOCALAPPDATA 'Programs\KnockBlock\knockblock.exe'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $machineLnk = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\KnockBlock.lnk'
          $userLnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\KnockBlock.lnk'
          $log = Join-Path $env:LOCALAPPDATA 'KnockBlock\logs\knockblock.log'
          $cfgDir = Join-Path $env:APPDATA 'KnockBlock'
          # An existing config file skips the first-start settings window.
          New-Item -ItemType Directory -Force $cfgDir | Out-Null
          Set-Content -Path (Join-Path $cfgDir 'config.json') -Value '{}'

          # Waits for one process only, with a deadline. Start-Process -Wait
          # also waits for every process it starts, so it never returns when
          # Restart Manager restarts the app under msiexec.
          function Wait-Bounded($p, $seconds, $what) {
            $null = $p.Handle # keeps ExitCode readable after the exit
            if (-not $p.WaitForExit($seconds * 1000)) {
              Write-Host "::error::$what still running after $seconds s"
              Get-Content msi.log -ErrorAction SilentlyContinue | Select-Object -Last 40
              Get-Content $log -Tail 30 -ErrorAction SilentlyContinue
              Get-Process knockblock, msiexec -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, StartTime, Path
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw "$what timed out"
            }
            $p.WaitForExit() # flushes ExitCode
          }
          function Msi($arguments) {
            Write-Host "==> msiexec $arguments"
            $p = Start-Process msiexec.exe -ArgumentList $arguments -PassThru
            Wait-Bounded $p 300 "msiexec $arguments"
            if ($p.ExitCode -ne 0) { Get-Content msi.log -ErrorAction SilentlyContinue | Select-Object -Last 60; throw "msiexec $arguments failed: $($p.ExitCode)" }
          }
          function Autostart { (Get-ItemProperty $run -Name KnockBlock -ErrorAction SilentlyContinue).KnockBlock }
          function Running { Get-Process knockblock -ErrorAction SilentlyContinue }

          # 1. For everyone: Program Files (silent installs need ALLUSERS=1;
          # without it they install for the current user only).
          Msi "/i `"$msi`" ALLUSERS=1 /qn /l*v msi.log"
          if (-not (Test-Path $machineExe)) { throw "knockblock.exe not installed at $machineExe" }
          if (-not (Test-Path $machineLnk)) { throw "Start menu shortcut missing at $machineLnk" }
          if ((Autostart) -ne "`"$machineExe`"") { throw "unexpected Run value: '$(Autostart)'" }
          Write-Host "Installed for everyone: $machineExe, shortcut, autostart"

          # The installed app starts, stays up, and logs its memory use
          # (CLAUDE.md §2.1). No device exists here, so it keeps retrying.
          $app = Start-Process $machineExe -ArgumentList '-debug-mem','3s','-debug' -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { Get-Content $log -ErrorAction SilentlyContinue; throw "knockblock.exe exited early (code $($app.ExitCode))" }
          $mem = Select-String -Path $log -Pattern 'private_working_set_kib=(\d+)' | Select-Object -Last 1
          if (-not $mem) { Get-Content $log; throw "no memory statistics in the log" }
          $kib = [int]$mem.Matches[0].Groups[1].Value
          Write-Host "Idle private working set: $kib KiB (target <= 15360, ceiling 20480)"
          if ($kib -gt 20480) { throw "private working set $kib KiB exceeds the 20 MB ceiling" }
          # A second start must exit at once (single instance).
          $second = Start-Process $machineExe -PassThru
          Wait-Bounded $second 60 'second instance'
          if ($second.ExitCode -ne 0) { throw "second instance exit code $($second.ExitCode)" }
          Stop-Process -Id $app.Id

          # The settings window opens on a real Windows, in English and
          # Italian, with all its controls; screenshots are kept as an
          # artifact and printed (base64) for reviewers without access to
          # artifacts.
          New-Item -ItemType Directory -Force screenshots | Out-Null
          foreach ($lang in 'en', 'it') {
            Set-Content -Path (Join-Path $cfgDir 'config.json') -Value "{`"language`": `"$lang`"}"
            $png = Join-Path (Resolve-Path screenshots) "settings-$lang.png"
            Write-Host "==> settings window ($lang)"
            $p = Start-Process $machineExe -ArgumentList '-settings-smoke', "`"$png`"" -PassThru
            Wait-Bounded $p 120 "settings window ($lang)"
            Select-String -Path $log -Pattern 'settings smoke test|private_working_set' | Select-Object -Last 2 | ForEach-Object { $_.Line }
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 20; throw "settings window ($lang) failed: exit code $($p.ExitCode)" }
            foreach ($tab in 1..4) {
              $shot = Join-Path (Resolve-Path screenshots) "settings-$lang-$tab.png"
              if (-not (Test-Path $shot)) { throw "no settings screenshot for $lang, tab $tab" }
              $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($shot))
              Write-Host "::group::settings-$lang-$tab.png (base64)"
              $b64 -split '(.{76})' | Where-Object { $_ } | ForEach-Object { Write-Host "PNG-$lang-$tab $_" }
              Write-Host "::endgroup::"
            }
          }
          Set-Content -Path (Join-Path $cfgDir 'config.json') -Value '{}'

          Msi "/x `"$msi`" /qn /l*v msi.log"
          if (Test-Path $machineExe) { throw "knockblock.exe left after uninstall" }
          if (Autostart) { throw "Run value left after uninstall" }
          Write-Host "Uninstalled cleanly"

          # 2. For the current user only, without autostart.
          Msi "/i `"$msi`" AUTOSTART=0 /qn /l*v msi.log"
          if (-not (Test-Path $userExe)) { throw "knockblock.exe not installed at $userExe" }
          if (-not (Test-Path $userLnk)) { throw "Start menu shortcut missing at $userLnk" }
          if (Autostart) { throw "Run value written despite AUTOSTART=0" }
          Msi "/x `"$msi`" /qn /l*v msi.log"
          if (Test-Path $userExe) { throw "knockblock.exe left after the per-user uninstall" }
          Write-Host "Per-user install and AUTOSTART=0 respected"

          # 3. Upgrade while the app runs: the setup closes it (it reports
          # offline and quits) and Restart Manager starts the new version.
          Msi "/i `"$old`" ALLUSERS=1 /qn /l*v msi.log"
          Start-Process $machineExe | Out-Null
          Start-Sleep -Seconds 5
          if (-not (Running)) { throw "0.0.1 did not start" }
          Msi "/i `"$msi`" ALLUSERS=1 /qn /l*v msi.log"
          Start-Sleep -Seconds 10
          Select-String -Path $log -Pattern 'closing at Windows|starting version' | Select-Object -Last 4 | ForEach-Object { $_.Line }
          if (-not (Select-String -Path $log -Pattern 'closing at Windows.*update=true')) { throw "the running app was not closed for the update" }
          $p = Running
          if (-not $p) { Write-Host "::warning::the app was not restarted after the update" }
          elseif ((Get-Item $p.Path).VersionInfo.ProductVersion -notlike "$version*") { throw "running version $((Get-Item $p.Path).VersionInfo.ProductVersion), want $version" }
          else { Write-Host "Updated and restarted: $version" }
          Get-Process knockblock -ErrorAction SilentlyContinue | Stop-Process
          Msi "/x `"$msi`" /qn /l*v msi.log"
          Write-Host "Upgrade test done"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-window-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore

  publish:
    name: Publish GitHub release
    if: needs.version.outputs.publish == 'true'
    needs: [version, firmware-bundle, windows-installer, installer-smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Only the deliverables: other artifacts (settings screenshots) are
      # for reviewers, not for the release.
      - uses: actions/download-artifact@v4
        with:
          pattern: "{windows-installer,firmware-bundle}"
          path: dist
          merge-multiple: true

      - name: Check the files to publish
        run: |
          ls -l dist
          test "$(ls dist | wc -l)" -eq 3
          ls dist/KnockBlock-*.msi dist/knockctl-*.exe dist/knockblock-*.esphomebundle.tar.gz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        # On a main push the release creates the tag on this commit. Tags
        # created with GITHUB_TOKEN do not start another workflow run.
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "KnockBlock $VERSION" \
            --notes-file docs/release-notes.md \
            --generate-notes
