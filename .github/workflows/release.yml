name: Release

# Builds the deliverables on every PR (as workflow artifacts, to try them)
# and publishes them as a GitHub release:
#   - on every push to main, as the next patch version after the latest
#     v<major>.<minor>.<patch> tag (v0.1.0 when there is none); the release
#     creates the tag;
#   - when a tag v<major>.<minor>.<patch> is pushed by hand, as that version
#     (to start a new minor or major series).
# Files:
#   - knockblock-<version>.esphomebundle.tar.gz  firmware config bundle
#   - KnockBlock-<version>.msi                   Windows installer
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, so consecutive merges get consecutive versions.
# PR runs are grouped per PR and only the latest one matters.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags

      - id: v
        # MSI versions must be numeric: major.minor.patch.
        #   tag push   -> the tag without "v"
        #   main push  -> latest release tag + 1 patch (0.1.0 if none);
        #                 nothing to publish if this commit is already tagged
        #   otherwise  -> 0.0.<run number>, not published
        run: |
          latest="$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              version="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
              version="${version#v}"
              echo "This commit is already released as v$version."
            elif [[ -z "$latest" ]]; then
              version=0.1.0
              publish=true
            else
              IFS=. read -r major minor patch <<<"${latest#v}"
              version="$major.$minor.$((patch + 1))"
              publish=true
            fi
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "Version $version (latest tag: ${latest:-none}, publish: $publish)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  firmware-bundle:
    name: Firmware bundle
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ESPHome (version from proto/VERSION)
        run: pip install "esphome==$(cat proto/VERSION)"

      - name: Build bundle
        run: scripts/build-firmware-bundle.sh "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bundle
          path: dist/knockblock-*.esphomebundle.tar.gz
          if-no-files-found: error

  windows-installer:
    name: Windows installer (MSI)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum

      - name: Install wixl and msitools
        run: sudo apt-get update -q && sudo apt-get install -y -q wixl msitools

      - name: Build MSI
        run: scripts/build-msi.sh "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/KnockBlock-*.msi
          if-no-files-found: error

  installer-smoke-test:
    name: Install and uninstall the MSI on Windows
    needs: windows-installer
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - name: Install, check, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem KnockBlock-*.msi).FullName
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\KnockBlock\knockblock.exe'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\KnockBlock.lnk'

          function Msi($arguments) {
            $p = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content msi.log -ErrorAction SilentlyContinue | Select-Object -Last 40; throw "msiexec $arguments failed: $($p.ExitCode)" }
          }
          function Autostart { (Get-ItemProperty $run -Name KnockBlock -ErrorAction SilentlyContinue).KnockBlock }

          # Default install: per user, no elevation, autostart on.
          Msi "/i `"$msi`" /qn /l*v msi.log"
          if (-not (Test-Path $exe)) { throw "knockblock.exe not installed at $exe" }
          if (-not (Test-Path $lnk)) { throw "Start menu shortcut missing at $lnk" }
          if ((Autostart) -ne "`"$exe`"") { throw "unexpected Run value: '$(Autostart)'" }
          Write-Host "Installed: $exe, shortcut, autostart"

          # The installed app starts, stays up, and logs its memory use
          # (CLAUDE.md §2.1). No device exists here, so it keeps retrying.
          # An existing config file skips the first-start settings page, so
          # no browser opens and the number is the idle tray alone.
          $cfgDir = Join-Path $env:APPDATA 'KnockBlock'
          New-Item -ItemType Directory -Force $cfgDir | Out-Null
          Set-Content -Path (Join-Path $cfgDir 'config.json') -Value '{}'
          $log = Join-Path $env:LOCALAPPDATA 'KnockBlock\logs\knockblock.log'
          $app = Start-Process $exe -ArgumentList '-debug-mem','3s','-debug' -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { Get-Content $log -ErrorAction SilentlyContinue; throw "knockblock.exe exited early (code $($app.ExitCode))" }
          Get-Content $log
          $mem = Select-String -Path $log -Pattern 'private_working_set_kib=(\d+)' | Select-Object -Last 1
          if (-not $mem) { throw "no memory statistics in the log" }
          $kib = [int]$mem.Matches[0].Groups[1].Value
          Write-Host "Idle private working set: $kib KiB (target <= 15360, ceiling 20480)"
          if ($kib -gt 20480) { throw "private working set $kib KiB exceeds the 20 MB ceiling" }
          # A second start must exit at once (single instance).
          $second = Start-Process $exe -PassThru -Wait
          if ($second.ExitCode -ne 0) { throw "second instance exit code $($second.ExitCode)" }
          Stop-Process -Id $app.Id

          # The settings window opens on a real Windows, in English and
          # Italian, with all its controls; screenshots are kept as an
          # artifact and printed (base64) for reviewers without access to
          # artifacts.
          New-Item -ItemType Directory -Force screenshots | Out-Null
          foreach ($lang in 'en', 'it') {
            Set-Content -Path (Join-Path $cfgDir 'config.json') -Value "{`"language`": `"$lang`"}"
            $png = Join-Path (Resolve-Path screenshots) "settings-$lang.png"
            $p = Start-Process $exe -ArgumentList '-settings-smoke', "`"$png`"" -PassThru -Wait
            Select-String -Path $log -Pattern 'settings smoke test|private_working_set' | Select-Object -Last 2 | ForEach-Object { $_.Line }
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 20; throw "settings window ($lang) failed: exit code $($p.ExitCode)" }
            if (-not (Test-Path $png)) { throw "no settings screenshot for $lang" }
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($png))
            Write-Host "::group::settings-$lang.png (base64)"
            $b64 -split '(.{76})' | Where-Object { $_ } | ForEach-Object { Write-Host "PNG-$lang $_" }
            Write-Host "::endgroup::"
          }
          Set-Content -Path (Join-Path $cfgDir 'config.json') -Value '{}'

          Msi "/x `"$msi`" /qn /l*v msi.log"
          if (Test-Path $exe) { throw "knockblock.exe left after uninstall" }
          if (Autostart) { throw "Run value left after uninstall" }
          Write-Host "Uninstalled cleanly"

          # AUTOSTART=0 skips the Run value.
          Msi "/i `"$msi`" AUTOSTART=0 /qn /l*v msi.log"
          if (-not (Test-Path $exe)) { throw "knockblock.exe not installed" }
          if (Autostart) { throw "Run value written despite AUTOSTART=0" }
          Msi "/x `"$msi`" /qn /l*v msi.log"
          Write-Host "AUTOSTART=0 respected"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-window-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore

  publish:
    name: Publish GitHub release
    if: needs.version.outputs.publish == 'true'
    needs: [version, firmware-bundle, windows-installer, installer-smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        # On a main push the release creates the tag on this commit. Tags
        # created with GITHUB_TOKEN do not start another workflow run.
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "KnockBlock $VERSION" \
            --notes-file docs/release-notes.md \
            --generate-notes
