# KnockBlock logic on ESPHome's `host` platform: the same shared package as
# the real board, minus display and LED, running as a Linux process. Used by
# the Go client's integration tests (scripts/itest-host.sh).
#
# Plaintext Native API on port 6053; no secrets needed.

substitutions:
  # Short, so tests can wait for sources to expire.
  watchdog_timeout: 10s

esphome:
  name: knockblock-host
  friendly_name: KnockBlock host test

host:

packages:
  core: !include common/core.yaml

external_components:
  - source:
      type: local
      path: components
    components: [knockblock_i18n, knockblock_presence]

api:
  reboot_timeout: 0s

script:
  - id: apply_status
    then:
      - logger.log:
          format: "Status %s, language %s, label '%s', app '%s', PC '%s'"
          args:
            - id(status).current_option().c_str()
            - id(display_language).current_option().c_str()
            - id(status_label).state.c_str()
            - id(active_app).state.c_str()
            - id(active_pc).state.c_str()

  - id: show_doorbell
    then:
      - logger.log: "Doorbell rang"

switch:
  # Stand-in for the board's flip_display (no display here), so the PC app's
  # setting can be tested.
  - platform: template
    id: flip_display
    name: Flip display
    optimistic: true
    restore_mode: ALWAYS_OFF
