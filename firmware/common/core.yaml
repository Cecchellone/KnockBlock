# Shared KnockBlock logic, used unchanged by the real board (knockblock.yaml)
# and by the host test build (host-test.yaml): the entities exposed over the
# Native API, the combined presence of every PC and the localized status
# label. See docs/presence.md.
#
# The including file must also load the knockblock_i18n and
# knockblock_presence external components (from this repository's
# firmware/components, locally or from GitHub) and define two scripts:
# - `apply_status` shows the current status (LED and display on the board, a
#   log line on the host). It runs after every change of `status` or
#   `display_language`, once `status_label`, `active_app` and `active_pc`
#   hold the new values.
# - `show_doorbell` shows that the doorbell rang (display and LED on the
#   board, a log line on the host). The `doorbell` event has already been
#   sent to the PC apps and Home Assistant when it runs.
# - `show_message` shows `message_text`, sent by `message_pc`, for
#   ${message_duration_ms} ms (the board's display, a log line on the host).

substitutions:
  # A source (a PC, or the manual source) that sends nothing for this long
  # is dropped, so the light does not stay on "call" after a PC shuts down
  # (CLAUDE.md §4). With no source left the status is `offline`.
  watchdog_timeout: 120s
  # Rings closer together than this count as one, so a held or bouncing
  # button does not flood the PCs with notifications.
  doorbell_cooldown_ms: "3000"
  # How long a message from a PC (show_message) stays on the display.
  message_duration_ms: "20000"
  # The Phone call switch turns itself off after this long.
  phone_call_max: 4h

knockblock_i18n:
  id: labels
  fallback: en
  language_select: display_language
  # One file per language; the file name is the language code.
  languages: !include_dir_named ../locales

knockblock_presence:
  id: presence
  status_select: status
  app_sensor: active_app
  pc_sensor: active_pc
  devices_sensor: active_devices
  timeout: ${watchdog_timeout}

logger:

globals:
  - id: last_ring_ms
    type: uint32_t
    initial_value: "0"

  # The last message from a PC (show_message) and who sent it.
  - id: message_text
    type: std::string
  - id: message_pc
    type: std::string

api:
  actions:
    # Called by every PC app: its name, its status ID and the app causing it
    # (empty if none), at least every ${watchdog_timeout}. Status `offline`
    # removes the PC at once (e.g. on shutdown).
    - action: report_presence
      variables:
        pc: string
        status: string
        app: string
      then:
        - lambda: 'id(presence).report(pc, status, app);'

    # Same, from PC apps that also tell what is in use, for the icons on the
    # display: `devices` is a comma-separated list of call, mic, mic_muted
    # and camera (docs/presence.md). PC apps use it when the firmware has it.
    - action: report_activity
      variables:
        pc: string
        status: string
        app: string
        devices: string
      then:
        - lambda: 'id(presence).report(pc, status, app, devices);'

    # A short message from a PC (e.g. the answer typed in the doorbell
    # notification), shown on the display for ${message_duration_ms} ms.
    # Longer messages are cut at 120 bytes, at a UTF-8 character boundary.
    - action: show_message
      variables:
        pc: string
        message: string
      then:
        - lambda: |-
            size_t n = std::min<size_t>(message.size(), 120);
            while (n > 0 && n < message.size() && (static_cast<uint8_t>(message[n]) & 0xC0) == 0x80)
              n--;
            id(message_text) = message.substr(0, n);
            id(message_pc) = pc.substr(0, 32);
        - script.execute: show_message

select:
  # The combined status, as language-neutral IDs; the display label is
  # localized separately. Setting it directly (Home Assistant, knockctl)
  # reports it as the "manual" source, kept alive by the heartbeat button.
  - platform: template
    id: status
    name: Status
    icon: mdi:door
    options: [free, muted, mic, camera, call, dnd, night, offline]
    initial_option: offline
    restore_value: false
    set_action:
      - lambda: 'id(presence).report(StringRef(), x, StringRef());'
    on_value:
      - script.execute: status_changed

  - platform: template
    id: display_language
    name: Display language
    icon: mdi:translate
    entity_category: config
    # Add a code here when adding firmware/locales/<code>.yaml.
    options: [en, it]
    initial_option: en
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: status_changed

switch:
  # Night mode: the light says "Sleeping", dimmed, until turned off (from
  # Home Assistant, e.g. on a schedule). It ranks above dnd but below a PC
  # in a call (docs/home-assistant.md).
  - platform: template
    id: night_mode
    name: Night mode
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: 'id(presence).report(StringRef("~night"), StringRef("night"), StringRef());'
    on_turn_off:
      - lambda: 'id(presence).report(StringRef("~night"), StringRef("offline"), StringRef());'

  # A call on the phone, turned on and off by a Home Assistant automation
  # (e.g. the companion app's phone state). The light shows "In a call"
  # with the phone icon and the call duration. It turns itself off after
  # ${phone_call_max} in case the automation never does.
  - platform: template
    id: phone_call
    name: Phone call
    icon: mdi:phone-in-talk
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(presence).report(StringRef("~phone"), StringRef("call"), StringRef(), StringRef("call"));'
      - script.execute: phone_call_limit
    on_turn_off:
      - script.stop: phone_call_limit
      - lambda: 'id(presence).report(StringRef("~phone"), StringRef("offline"), StringRef());'

interval:
  # The switches are sources like the PCs: report them again well within
  # the watchdog timeout while they are on.
  - interval: 30s
    then:
      - lambda: |-
          if (id(night_mode).state)
            id(presence).report(StringRef("~night"), StringRef("night"), StringRef());
          if (id(phone_call).state)
            id(presence).report(StringRef("~phone"), StringRef("call"), StringRef(), StringRef("call"));

button:
  # Keeps a status set directly on the `status` select alive. PC apps use
  # report_presence instead.
  - platform: template
    id: heartbeat
    name: Heartbeat
    icon: mdi:heart-pulse
    entity_category: diagnostic
    on_press:
      - lambda: 'id(presence).refresh(StringRef());'

  # Rings the doorbell like the physical button (Home Assistant, tests).
  - platform: template
    id: ring_doorbell_button
    name: Ring doorbell
    icon: mdi:bell-ring
    on_press:
      - script.execute: ring_doorbell

event:
  # Fired on every ring. The PC apps show a notification; Home Assistant
  # can use it in automations.
  - platform: template
    id: doorbell
    name: Doorbell
    device_class: doorbell
    event_types: [ring]

text_sensor:
  # The text shown on the display, in the display language.
  - platform: template
    id: status_label
    name: Status label
    icon: mdi:label-outline
    entity_category: diagnostic
    update_interval: never

  # App and PC causing the current status (empty when none, or when the
  # status was set manually).
  - platform: template
    id: active_app
    name: Active app
    icon: mdi:application-outline
    update_interval: never

  - platform: template
    id: active_pc
    name: Active PC
    icon: mdi:monitor
    update_interval: never

  # What the PC shown has in use: call, mic or mic_muted, camera
  # (comma-separated; empty when nothing).
  - platform: template
    id: active_devices
    name: Active devices
    icon: mdi:phone-in-talk
    entity_category: diagnostic
    update_interval: never

script:
  - id: phone_call_limit
    mode: restart
    then:
      - delay: ${phone_call_max}
      - switch.turn_off: phone_call

  - id: status_changed
    mode: queued
    then:
      - text_sensor.template.publish:
          id: status_label
          state: !lambda |-
            return id(labels).get(id(display_language).current_option(),
                                  id(status).current_option());
      - script.execute: apply_status

  # The board's button and the `Ring doorbell` button both end up here.
  - id: ring_doorbell
    then:
      - if:
          condition:
            lambda: |-
              const uint32_t now = millis();
              if (id(last_ring_ms) != 0 && now - id(last_ring_ms) < ${doorbell_cooldown_ms})
                return false;
              id(last_ring_ms) = now == 0 ? 1 : now;
              return true;
          then:
            - event.trigger:
                id: doorbell
                event_type: ring
            - script.execute: show_doorbell
