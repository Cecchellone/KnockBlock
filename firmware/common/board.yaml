# Hardware package for the Waveshare ESP32-C6-LCD-1.47 (the version
# without touch): ESP32-C6, 1.47" ST7789 LCD (172x320), one WS2812 RGB LED.
# Used together with core.yaml by knockblock.yaml (local build) and
# knockblock-package.yaml (remote package). The including file provides Wi-Fi
# and the API encryption key.
#
# Pin sources:
# - Board wiki and schematic: https://www.waveshare.com/wiki/ESP32-C6-LCD-1.47
# - LCD CS/DC/RST, panel size, offset and colour inversion come from ESPHome's
#   built-in mipi_spi model WAVESHARE-ESP32-C6-LCD-1.47
#   (esphome/components/mipi_spi/models/waveshare.py, ESPHome 2026.10.0).
# - SPI bus (SCLK GPIO7, MOSI GPIO6), backlight GPIO22 and RGB LED GPIO8 match
#   the wiki pin table as transcribed in
#   https://github.com/trianglesis/esp32-c6_LVGL (README).
#   TODO(verify): confirm backlight GPIO22 and LED GPIO8 against the official
#   wiki/schematic; waveshare.com was not reachable when this was written.
# - Doorbell: the board's BOOT button, which on the ESP32-C6 is GPIO9 (a
#   strapping pin: held at reset it enters download mode, which is harmless).
#   TODO(verify): BOOT on GPIO9, active low with a pull-up, on the schematic.

substitutions:
  # Defaults; override them in the including file.
  name: knockblock
  friendly_name: KnockBlock
  # Time zone of the clock in the info bar (tz database name).
  timezone: Europe/Rome
  # Button that rings the doorbell: the BOOT button by default. For an
  # external push button, wire it between a free GPIO and GND and set the
  # GPIO here.
  doorbell_pin: GPIO9

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: cecchellone.knockblock
    version: "0.1.0"  # project version; release builds set it

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

api:
  # Neither the PC app nor Home Assistant is always connected: never reboot
  # because no client is connected. The including file sets the encryption
  # key (api: encryption: key:).
  reboot_timeout: 0s

ota:
  # OTA uploads are encrypted and authenticated with the Native API key.
  - platform: esphome
    encryption: {}

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO6

color:
  # Status colours, shared by the LED and the display background.
  - id: color_free
    hex: 00B050
  # In a call with the microphone muted and the camera off.
  - id: color_muted
    hex: 00A0E0
  - id: color_mic
    hex: FFB000
  - id: color_camera
    hex: FF6000
  - id: color_call
    hex: E00000
  - id: color_dnd
    hex: 8000C0
  # Night mode: a dark blue, with dimmed text and LED.
  - id: color_night
    hex: 0A1440
  - id: color_offline
    hex: 303030

globals:
  - id: current_color
    type: Color
    initial_value: Color(0x30, 0x30, 0x30)

  # True while the display shows the doorbell instead of the status.
  - id: doorbell_shown
    type: bool
    initial_value: "false"

  # millis() when the message on display (show_message) appeared; 0 when
  # none is shown.
  - id: message_since
    type: uint32_t
    initial_value: "0"

font:
  # Must contain every character used by firmware/locales/*.yaml; the
  # knockblock_i18n component checks this at `esphome config` time. Extend
  # `glyphs` when a language needs more letters.
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_label
    size: 44
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["àèéìòùÀÈÉÌÒÙ"]

  # The info bar: PC, app and time. Names come from the PC apps, so they are
  # not checked; characters outside this set are not drawn.
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_detail
    size: 18
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["àèéìòùÀÈÉÌÒÙ·"]

  # Messages from a PC (show_message): free text, so not checked; characters
  # outside this set are not drawn.
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_message
    size: 26
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["àèéìòùÀÈÉÌÒÙ·"]

  # The icons at the bottom: phone, microphone and camera, on and off, from
  # Material Design Icons (Pictogrammers, Apache License 2.0), pinned to a
  # release. Codepoints from css/materialdesignicons.css of that release.
  - file:
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: font_icons
    size: 28
    glyphs:
      - "\U000F03F2" # phone
      - "\U000F036C" # microphone
      - "\U000F036D" # microphone-off
      - "\U000F0567" # video
      - "\U000F0568" # video-off

knockblock_i18n:
  check_fonts: [font_label]

display:
  - platform: mipi_spi
    id: main_display
    model: WAVESHARE-ESP32-C6-LCD-1.47
    # Landscape: 320x172. The flip_display switch turns it to 270.
    rotation: 90
    # Redrawn on every status change, every minute (clock) and every second
    # during a call (call_timer below).
    update_interval: 30s
    lambda: |-
      const Color bg = id(current_color);
      // Black text on light backgrounds, white otherwise.
      const int luma = (299 * bg.r + 587 * bg.g + 114 * bg.b) / 1000;
      // Night mode dims the text too.
      const bool night = id(status).current_option() == "night";
      const Color fg = night ? Color(110, 120, 160) : luma > 150 ? Color::BLACK : Color::WHITE;
      it.fill(bg);

      if (id(doorbell_shown)) {
        // A bell, drawn with shapes so it needs no font or image.
        const int x = it.get_width() / 2, y = it.get_height() / 2 - 4;
        it.filled_circle(x, y - 46, 7, fg);                           // handle
        it.filled_circle(x, y - 14, 34, fg);                          // dome
        it.filled_rectangle(x - 34, y - 14, 69, 40, fg);              // body
        it.filled_triangle(x - 34, y + 14, x - 52, y + 38, x - 34, y + 38, fg);
        it.filled_triangle(x + 34, y + 14, x + 52, y + 38, x + 34, y + 38, fg);
        it.filled_rectangle(x - 52, y + 32, 105, 8, fg);              // rim
        it.filled_circle(x, y + 50, 10, fg);                          // clapper
        for (int i = 0; i < 4; i++) {                                 // ringing
          it.line(x - 70 - i, y - 40, x - 82 - i, y - 10, fg);
          it.line(x + 70 + i, y - 40, x + 82 + i, y - 10, fg);
        }
        return;
      }

      const int W = it.get_width(), H = it.get_height(), bar = 30;
      int x1, y1, w, h;

      if (const uint32_t since = id(message_since); since != 0) {
        // A message: who sent it (and the app) at the top, the text in the
        // middle (words wrapped, at most four lines), and at the bottom a
        // white bar that shrinks towards the centre as its time runs out.
        // A message colour replaces the status colour.
        Color mbg = bg, mfg = fg;
        if (const uint32_t rgb = id(message_color); rgb != knockblock_presence::Presence::NO_COLOR) {
          mbg = Color(rgb >> 16 & 0xFF, rgb >> 8 & 0xFF, rgb & 0xFF);
          mfg = (299 * mbg.r + 587 * mbg.g + 114 * mbg.b) / 1000 > 150 ? Color::BLACK : Color::WHITE;
          it.fill(mbg);
        }
        it.filled_rectangle(0, 0, W, bar, Color(mbg.r * 3 / 4, mbg.g * 3 / 4, mbg.b * 3 / 4));
        if (!id(privacy_mode).state) {
          it.print(6, bar / 2, id(font_detail), mfg, TextAlign::CENTER_LEFT, id(message_pc).c_str());
          it.print(W / 2, bar / 2, id(font_detail), mfg, TextAlign::CENTER, id(message_app).c_str());
        }
        std::vector<std::string> lines;
        std::string line, word;
        const std::string &msg = id(message_text);
        auto fits = [&](const std::string &s) {
          it.get_text_bounds(0, 0, s.c_str(), id(font_message), TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
          return w <= W - 16;
        };
        for (size_t i = 0; i <= msg.size(); i++) {
          if (i < msg.size() && msg[i] != ' ') {
            word += msg[i];
            continue;
          }
          if (word.empty())
            continue;
          const std::string joined = line.empty() ? word : line + " " + word;
          if (fits(joined) || line.empty()) {
            line = joined;  // a single word too long for a line stays whole
          } else {
            lines.push_back(line);
            line = word;
          }
          word.clear();
        }
        if (!line.empty())
          lines.push_back(line);
        if (lines.size() > 4)
          lines.resize(4);
        const int lh = 30, top = bar + (H - bar - 8 - lh * (int) lines.size()) / 2;
        for (size_t i = 0; i < lines.size(); i++)
          it.print(W / 2, top + lh * i + lh / 2, id(font_message), mfg, TextAlign::CENTER, lines[i].c_str());
        const uint32_t elapsed = millis() - since;
        const uint32_t total = id(message_ms);
        const int left = elapsed >= total ? 0 : (int) ((uint64_t) W * (total - elapsed) / total);
        it.filled_rectangle((W - left) / 2, H - 6, left, 6, Color::WHITE);
        return;
      }

      // Info bar at the top, slightly darker: the PC on the left, the app in
      // the middle (both hidden in privacy mode, and empty when the status
      // has no source), and on the right how long the call has lasted, else
      // the time.
      it.filled_rectangle(0, 0, W, bar, Color(bg.r * 3 / 4, bg.g * 3 / 4, bg.b * 3 / 4));
      // Cuts text (whole UTF-8 characters) until it fits in maxw pixels.
      auto fit = [&](std::string s, int maxw) {
        while (!s.empty()) {
          it.get_text_bounds(0, 0, s.c_str(), id(font_detail), TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
          if (w <= maxw)
            break;
          do s.pop_back(); while (!s.empty() && (s.back() & 0xC0) == 0x80);
        }
        return s;
      };
      char right[16] = "";
      if (const uint32_t start = id(presence).call_start(); start != 0) {
        const unsigned s = (millis() - start) / 1000;
        if (s >= 3600)
          snprintf(right, sizeof(right), "%u:%02u:%02u", s / 3600, s / 60 % 60, s % 60);
        else
          snprintf(right, sizeof(right), "%u:%02u", s / 60, s % 60);
      } else {
        auto now = id(sntp_time).now();
        if (now.is_valid())
          now.strftime(right, sizeof(right), "%H:%M");
      }
      it.print(W - 6, bar / 2, id(font_detail), fg, TextAlign::CENTER_RIGHT, right);
      if (!id(privacy_mode).state) {
        it.print(6, bar / 2, id(font_detail), fg, TextAlign::CENTER_LEFT, fit(id(active_pc).state, 92).c_str());
        it.print(W / 2, bar / 2, id(font_detail), fg, TextAlign::CENTER, fit(id(active_app).state, 120).c_str());
      }

      // Icons at the bottom, while a PC reports: the phone during a call, the
      // microphone (crossed out when muted) and the camera. Unused ones are
      // dimmed.
      const bool offline = id(status).current_option() == "offline";
      const int row = offline ? 0 : 36;
      if (!offline) {
        const uint8_t dev = id(presence).devices();
        using P = esphome::knockblock_presence::Presence;
        const Color dim((fg.r + 2 * bg.r) / 3, (fg.g + 2 * bg.g) / 3, (fg.b + 2 * bg.b) / 3);
        const int y = H - row / 2;
        it.print(W / 2 - 64, y, id(font_icons), (dev & P::CALL) ? fg : dim, TextAlign::CENTER, "\U000F03F2");
        if (dev & P::MIC)
          it.print(W / 2, y, id(font_icons), fg, TextAlign::CENTER, "\U000F036C");
        else
          it.print(W / 2, y, id(font_icons), (dev & P::MIC_MUTED) ? fg : dim, TextAlign::CENTER, "\U000F036D");
        it.print(W / 2 + 64, y, id(font_icons), (dev & P::CAMERA) ? fg : dim, TextAlign::CENTER,
                 (dev & P::CAMERA) ? "\U000F0567" : "\U000F0568");
      }

      // The status label, centered between the bar and the icons; two
      // lines if too wide.
      const int cx = W / 2, cy = bar + (H - bar - row) / 2;
      const std::string &text = id(status_label).state;
      it.get_text_bounds(cx, cy, text.c_str(), id(font_label), TextAlign::CENTER, &x1, &y1, &w, &h);
      const size_t split = text.rfind(' ', text.size() / 2 + 1);
      if (w <= W - 16 || split == std::string::npos) {
        it.print(cx, cy, id(font_label), fg, TextAlign::CENTER, text.c_str());
        return;
      }
      // Break at the space closest to the middle.
      const std::string first = text.substr(0, split);
      const std::string second = text.substr(split + 1);
      it.print(cx, cy - h / 2 - 4, id(font_label), fg, TextAlign::CENTER, first.c_str());
      it.print(cx, cy + h / 2 + 4, id(font_label), fg, TextAlign::CENTER, second.c_str());

interval:
  # The call duration in the info bar counts seconds.
  - id: call_timer
    interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(presence).call_start() != 0 && !id(doorbell_shown) && id(message_since) == 0;'
          then:
            - component.update: main_display

  # The bar under a message shrinks smoothly.
  - id: message_timer
    interval: 100ms
    then:
      - if:
          condition:
            lambda: 'return id(message_since) != 0 && !id(doorbell_shown);'
          then:
            - component.update: main_display

time:
  # The clock in the info bar, from the internet. Home Assistant is not
  # needed.
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    on_time:
      - seconds: 0
        then:
          - component.update: main_display

number:
  # Brightness of the status LED, kept across reboots. Home Assistant can
  # still drive the LED directly until the next status change.
  - platform: template
    id: led_brightness
    name: LED brightness
    icon: mdi:brightness-percent
    entity_category: config
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 60
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: apply_status

binary_sensor:
  - platform: gpio
    id: doorbell_button
    name: Doorbell button
    icon: mdi:doorbell
    pin:
      number: ${doorbell_pin}
      inverted: true
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 30ms
    on_press:
      - script.execute: ring_doorbell

switch:
  # Turns the picture upside down, for a board mounted the other way round.
  - platform: template
    id: flip_display
    name: Flip display
    icon: mdi:screen-rotation
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(main_display).set_rotation(display::DISPLAY_ROTATION_270_DEGREES);
      - component.update: main_display
    on_turn_off:
      - lambda: id(main_display).set_rotation(display::DISPLAY_ROTATION_90_DEGREES);
      - component.update: main_display

  # Hides app and PC names on the display (Home Assistant still sees them).
  - platform: template
    id: privacy_mode
    name: Privacy mode
    icon: mdi:eye-off
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - component.update: main_display
    on_turn_off:
      - component.update: main_display

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO22

light:
  - platform: monochromatic
    id: backlight
    name: Display backlight
    icon: mdi:brightness-6
    entity_category: config
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON

  # Follows the status; Home Assistant can also drive it directly until the
  # next status change.
  - platform: esp32_rmt_led_strip
    id: status_led
    name: Status LED
    pin:
      number: GPIO8
      # GPIO8 is a strapping pin; the board wires the LED to it by design.
      ignore_strapping_warning: true
    num_leds: 1
    chipset: WS2812
    # Verified on the real board: with GRB, red and green were swapped.
    channel_colors: RGB
    restore_mode: ALWAYS_OFF

script:
  - id: apply_status
    then:
      - lambda: |-
          const auto st = id(status).current_option();
          Color c = id(color_offline);
          const uint32_t custom = id(presence).color();
          if (st == "free") c = id(color_free);
          else if (st == "muted") c = id(color_muted);
          else if (st == "mic") c = id(color_mic);
          else if (st == "camera") c = id(color_camera);
          else if (st == "call") c = id(color_call);
          else if (st == "dnd") c = id(color_dnd);
          else if (st == "night") c = id(color_night);
          // A custom colour (set_status) replaces the status colour.
          if (custom != knockblock_presence::Presence::NO_COLOR)
            c = Color(custom >> 16 & 0xFF, custom >> 8 & 0xFF, custom & 0xFF);
          id(current_color) = c;
      - if:
          condition:
            lambda: 'return id(status).current_option() == "offline";'
          then:
            - light.turn_off: status_led
          else:
            - light.turn_on:
                id: status_led
                # Night mode keeps the LED faint.
                brightness: !lambda |-
                  const float b = id(led_brightness).state / 100.0f;
                  return id(status).current_option() == "night" ? std::min(b, 0.1f) : b;
                red: !lambda 'return id(current_color).r / 255.0f;'
                green: !lambda 'return id(current_color).g / 255.0f;'
                blue: !lambda 'return id(current_color).b / 255.0f;'
      - component.update: main_display

  # Shows a bell for a few seconds and blinks the LED white, then goes back
  # to the status.
  - id: show_doorbell
    mode: restart
    then:
      - lambda: id(doorbell_shown) = true;
      - component.update: main_display
      - repeat:
          count: 3
          then:
            - light.turn_on:
                id: status_led
                brightness: 100%
                red: 1.0
                green: 1.0
                blue: 1.0
                transition_length: 0s
            - delay: 250ms
            - light.turn_off:
                id: status_led
                transition_length: 0s
            - delay: 250ms
      - delay: 3500ms
      - lambda: id(doorbell_shown) = false;
      - script.execute: apply_status

  # Shows a message for message_ms (a new one starts over), then goes back
  # to the status.
  - id: show_message
    mode: restart
    then:
      - lambda: id(message_since) = std::max<uint32_t>(millis(), 1);
      - component.update: main_display
      - delay: !lambda 'return id(message_ms);'
      - lambda: id(message_since) = 0;
      - component.update: main_display
