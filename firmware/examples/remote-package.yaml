# Example device config that uses KnockBlock as a remote package, for the
# ESPHome dashboard or the Home Assistant ESPHome add-on. Copy it, adjust the
# names and put Wi-Fi and the API key in your secrets.yaml.
#
# ESPHome clones the repository anonymously, so this works once the
# KnockBlock repository is public. While it is private, build from a checkout
# with knockblock.yaml, or give git credentials for github.com to the
# machine that runs ESPHome.

substitutions:
  name: knockblock
  friendly_name: KnockBlock
  # KnockBlock version: a branch or tag of the GitHub repository. Used for
  # both the package and its external component.
  knockblock_ref: main
  # Time zone of the clock on the display (default Europe/Rome).
  # timezone: Europe/London
  # Button that rings the doorbell (default: the board's BOOT button, GPIO9).
  # doorbell_pin: GPIO4

packages:
  knockblock:
    url: https://github.com/Cecchellone/KnockBlock
    ref: ${knockblock_ref}
    files: [firmware/knockblock-package.yaml]
    refresh: 1d

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key
